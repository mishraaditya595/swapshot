name: SWAPSHOT PR Web Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Game source and export inputs are untrusted until reviewed.
# The PR job never receives write access to Pages or repository contents.
permissions:
  contents: read

jobs:
  export-web:
    name: Godot Web preview export
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out PR game source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore official Web template cache
        uses: actions/cache@v4
        id: web-template
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable/web_release.zip
          key: swapshot-godot-4.7.2-stable-web-release-v1

      - name: Install Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/godot-editor.zip"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$RUNNER_TEMP/godot-editor.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64" --version

      - name: Install matching official Web export template
        if: steps.web-template.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The official archive includes all platforms (~1.2 GiB).
          # Subsequent PRs restore only the much smaller Web release template.
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -o "$RUNNER_TEMP/export-templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$dir"
          unzip -p "$RUNNER_TEMP/export-templates.tpz" templates/web_release.zip > "$dir/web_release.zip"
          test -s "$dir/web_release.zip"
          unzip -tqq "$dir/web_release.zip"
          rm -f "$RUNNER_TEMP/export-templates.tpz"

      - name: Import and export Web preview
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_release.zip"
          # Temporary preview preset, NOT the final MS-14 Web release preset.
          cp .github/web-preview-export-presets.cfg export_presets.cfg
          mkdir -p "$RUNNER_TEMP/web-preview"
          godot="$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          "$godot" --headless --path . --import 2>&1 | tee "$RUNNER_TEMP/web-import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/web-import.log"; then
            echo "Godot reported import errors" >&2
            exit 1
          fi
          "$godot" --headless --path . --export-release Web "$RUNNER_TEMP/web-preview/index.html" \
            2>&1 | tee "$RUNNER_TEMP/web-export.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/web-export.log"; then
            echo "Godot reported export errors" >&2
            exit 1
          fi
          python3 .github/scripts/verify_web_preview.py "$RUNNER_TEMP/web-preview"
          printf '%s\n' "$PR_NUMBER" > "$RUNNER_TEMP/web-preview/preview-pr.txt"
          echo "Web export built for PR #$PR_NUMBER; Pages publishing runs separately." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser build for trusted publisher
        uses: actions/upload-artifact@v4
        with:
          name: swapshot-web-preview
          path: ${{ runner.temp }}/web-preview/
          if-no-files-found: error
          retention-days: 7
