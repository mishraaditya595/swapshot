name: SWAPSHOT CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static audit and audit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SWAPSHOT static audit
        run: python3 .agents/skills/swapshot-review/scripts/audit_project.py --root .
      - name: Audit unit tests
        run: python3 -m unittest discover -s .agents/skills/swapshot-review/tests -v
      - name: Milestone tracker integrity
        run: python3 scripts/validate_milestones.py docs/MILESTONES.md
      - name: Milestone and pre-merge validator tests
        run: python3 -m unittest discover -s tests -v

  godot-import:
    name: Godot 4.7.2 headless import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot editor (pinned release)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"             --output /tmp/godot.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import project resources and reject engine errors
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/godot-import.log; then
            echo "Godot printed an error during import" >&2
            exit 1
          fi
      - name: MS-01 physics scene smoke test
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/ms01_scene_smoke.gd 2>&1 | tee /tmp/ms01-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|MS-01 FAIL:' /tmp/ms01-smoke.log; then
            echo "Godot MS-01 physics smoke test reported errors" >&2
            exit 1
          fi
      - name: MS-02 rifle integration smoke test
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/ms02_rifle_smoke.gd 2>&1 | tee /tmp/ms02-smoke.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:|MS-02 FAIL:' /tmp/ms02-smoke.log; then
            echo "Godot MS-02 rifle smoke test reported errors" >&2
            exit 1
          fi
      - name: Startup smoke test (no gameplay assertion)
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 2 2>&1 | tee /tmp/godot-startup.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' /tmp/godot-startup.log; then
            echo "Godot printed an error during startup" >&2
            exit 1
          fi
